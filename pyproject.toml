[project]
name = "extracao-nf-llm"
version = "0.1.0"
description = "API de extração de dados de Nota Fiscal com LangChain e LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pillow>=11.0.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.49.0",
    "python-multipart>=0.0.20",
    "langchain-core>=1.6.2",
    "langchain-google-genai>=4.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["extracao_nf"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_google_genai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["src/extracao_nf"]
branch = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extracao_nf"]
